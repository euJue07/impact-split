name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Oldest supported interpreter, matching `[tool.mypy] python_version`.
          # On a newer one, pip resolves dependencies that a 3.10 user can never
          # have — numpy >=2.5 requires 3.12 and its stubs use PEP 695 syntax,
          # which mypy then refuses to parse as 3.10. Type-checking against the
          # dependency set the floor actually gets is the honest check; the test
          # matrix covers 3.10-3.13. The other steps here are version-agnostic
          # (the wheel is py3-none-any).
          python-version: "3.10"
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Ruff lint
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy impact_split
      - name: Bandit
        run: python -m bandit -r impact_split -ll
      - name: Build distributions
        run: python -m build --no-isolation
      - name: Validate package metadata
        run: python -m twine check dist/*
