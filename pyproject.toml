[build-system]
requires = ["flit_core >=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "impact_split"
version = "0.3.0"
description = "A tree based approach to determine the driver of a KPI"
authors = [
  { name = "Juedi Myro Eugenio" },
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
readme = "README.md"
keywords = ["eda", "kpi", "decision-tree", "segmentation", "impact-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
    "bandit",
    "build",
    "flit_core>=3.12,<4",
    # mypy and ruff below are pinned: left unpinned, CI resolves whatever is
    # current at run time and fails on rules no local install has yet, in files
    # nobody touched. Bump either deliberately, fixing the new findings in that
    # same change — never by drift. See docs/plans/followup-ci-ruff-drift.md.
    "mypy~=2.3.0",
    "pandas-stubs",
    "pytest",
    "ruff~=0.15.5",
    "twine",
]
bench = [
    "scikit-learn",
]
notebooks = [
    "ipykernel",
    "ipywidgets",
    "jupyterlab",
    "kagglehub",
    "scikit-learn",
]
docs = [
    "mkdocs",
]

[project.urls]
Homepage = "https://github.com/euJue07/impact-split"
Documentation = "https://github.com/euJue07/impact-split/blob/main/docs/docs/getting-started.md"
Repository = "https://github.com/euJue07/impact-split"
Issues = "https://github.com/euJue07/impact-split/issues"


[tool.ruff]
line-length = 99
src = ["impact_split"]
include = ["pyproject.toml", "impact_split/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
# I: isort; UP: pyupgrade; B: bugbear; SIM: simplify
# TRY004: TypeError for a wrong-type argument, ValueError for a wrong value.
# BLE001: no blind `except Exception` — name what you expect to fail.
# Both are selected explicitly so the conventions are enforced under the pinned
# ruff rather than resurfacing whenever a bump changes the default rule set.
# ISC004 belongs here too, but is still a preview rule in 0.15.5 — add it with
# the 0.16 bump (see docs/plans/followup-ci-ruff-drift.md).
extend-select = ["I", "UP", "B", "SIM", "TRY004", "BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["impact_split"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.10"
packages = ["impact_split"]
warn_unused_ignores = true
show_error_codes = true
strict = false
# Third-party libs ship incomplete stubs; avoid blocking CI on their gaps.
[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

